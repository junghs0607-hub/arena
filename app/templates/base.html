<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arena Studio{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('admin.dashboard') }}">Arena Studio</a>
    {% if current_user.is_authenticated %}
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('sources.list_sources') }}">소스 영상</a>
      <a class="nav-link" href="{{ url_for('projects.list_projects') }}">제작 영상</a>
      <a class="nav-link" href="{{ url_for('projects.list_projects', format='shorts') }}">Shorts</a>
      <a class="nav-link" href="{{ url_for('projects.list_projects', format='longform') }}">Long-form</a>
      <a class="nav-link" href="{{ url_for('youtube.uploads') }}">YouTube</a>
      <a class="nav-link" href="{{ url_for('youtube.schedule') }}">예약</a>
      <a class="nav-link" href="{{ url_for('settings.index') }}">설정</a>
      <a class="nav-link" href="{{ url_for('auth.logout') }}">로그아웃</a>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
