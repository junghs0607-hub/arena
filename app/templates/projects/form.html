{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">프로젝트 생성</h1>
<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-8">
    <label class="form-label">소스</label>
    <select class="form-select" name="source_id" required>
      {% for s in sources %}
        <option value="{{ s.id }}">{{ s.title }} {% if not s.rights_confirmed %}(권리 미확인){% endif %}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">제목</label>
    <input class="form-control" name="title">
  </div>
  <div class="col-md-3">
    <label class="form-label">포맷</label>
    <select class="form-select" name="format_type">
      <option value="shorts">Shorts</option>
      <option value="longform">Long-form</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">목표 길이(초)</label>
    <select class="form-select" name="target_duration">
      <option>30</option><option selected>60</option><option>90</option>
      <option>180</option><option>300</option><option>600</option><option>900</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">언어</label>
    <select class="form-select" name="language">
      <option value="ko">한국어</option>
      <option value="en">영어</option>
      <option value="ja">일본어</option>
      <option value="zh">중국어</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">자동화</label>
    <select class="form-select" name="automation_mode">
      <option value="semi">반자동</option>
      <option value="auto">완전 자동</option>
      <option value="manual">수동</option>
    </select>
  </div>
  <div class="col-12"><button class="btn btn-danger">생성</button></div>
</form>
{% endblock %}
