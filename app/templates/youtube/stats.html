{% extends "base.html" %}
{% block content %}
<h1 class="h3">통계</h1>
<table class="table table-dark">
  <thead><tr><th>Upload</th><th>조회</th><th>좋아요</th><th>댓글</th><th>구독</th></tr></thead>
  <tbody>
  {% for s in items %}
    <tr><td>{{ s.upload_id }}</td><td>{{ s.views }}</td><td>{{ s.likes }}</td><td>{{ s.comments }}</td><td>{{ s.subscribers_gained }}</td></tr>
  {% else %}
    <tr><td colspan="5">데이터 없음</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
